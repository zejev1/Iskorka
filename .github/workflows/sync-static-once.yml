name: Sync static snapshot once
on:
  push:
    branches:
      - design/body-human-physiology-v1
permissions:
  contents: write
jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[static-sync]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/body-human-physiology-v1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run verify
      - name: Commit generated static snapshot
        shell: bash
        run: |
          if git diff --quiet -- assets index.html validation/build-inputs.json; then
            echo "Static snapshot already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets index.html validation/build-inputs.json
          git commit -m "build: refresh static snapshot [static-sync]"
          git push origin HEAD:design/body-human-physiology-v1
