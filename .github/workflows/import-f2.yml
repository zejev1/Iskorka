name: Iskorka pinned F2 import
on:
  push:
    branches: [bootstrap/iskorka-human-lab]
    paths: [.github/workflows/import-f2.yml]
permissions:
  contents: write
concurrency:
  group: iskorka-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/iskorka-human-lab
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Import exact user-approved donor without modifying Ainkrad
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'bootstrap/iskorka-human-lab'
          test ! -e .iskorka-donor.json
          donor="$RUNNER_TEMP/iskorka-donor"
          git init "$donor"
          git -C "$donor" remote add origin https://github.com/zejev1/ainkrad-v0.3.git
          git -C "$donor" fetch --depth=1 origin 0563af1dc1fea7d2abe76eb17501ef574078b4d2
          test "$(git -C "$donor" rev-parse FETCH_HEAD)" = 0563af1dc1fea7d2abe76eb17501ef574078b4d2
          git -C "$donor" archive FETCH_HEAD | tar -x --exclude='./.github' --exclude='.github' --exclude=AGENTS.md --exclude=README.md
          printf '%s\n' '{"repository":"zejev1/ainkrad-v0.3","sha":"0563af1dc1fea7d2abe76eb17501ef574078b4d2","verifiedTree":"e3dcd421d6c0204fc61f92f970b00e07c6cf533b","stage":"imported-awaiting-runtime-adaptation"}' > .iskorka-donor.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'feat: import complete final F2 source for isolated Iskorka adaptation'
          git push origin HEAD:bootstrap/iskorka-human-lab
      - name: Install donor toolchain
        run: npm ci
      - name: Export source and installed toolchain for local verification
        shell: bash
        run: |
          tar -czf "$RUNNER_TEMP/iskorka-workspace.tar.gz" --exclude=.git .
      - uses: actions/upload-artifact@v4
        with:
          name: iskorka-import-workspace
          path: ${{ runner.temp }}/iskorka-workspace.tar.gz
          retention-days: 3
